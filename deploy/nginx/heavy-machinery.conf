# 重工机械 H5 移动端 - Nginx 站点配置
# 放到服务器 /etc/nginx/conf.d/heavy-machinery.conf 后执行 nginx -s reload
#
# 端口规划：H5 前端 8082，后端 API 8081（80/8080/9090 已被占用）

server {
    listen 8082;
    server_name 112.124.18.181;

    # H5 静态文件（前端构建产物 dist/ 上传到此目录）
    root /data/www/heavy-machinery/mobile;
    index index.html;

    # gzip 压缩
    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # 前端路由（Taro H5 使用 hash 路由，无需 history fallback；如需 browser 路由请取消注释）
    # location / {
    #     try_files $uri $uri/ /index.html;
    # }

    # 静态资源缓存
    location /static/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # API 反向代理到后端(8081)
    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }
}

server:
  port: 8081
  servlet:
    context-path: /

spring:
  application:
    name: heavy-machinery-server
  # 默认使用 H2 内存数据库，便于快速启动开发
  datasource:
    url: jdbc:h2:mem:heavymachinery;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

jwt:
  # HS256 密钥，生产环境请替换为更强的密钥并通过环境变量注入
  secret: ${JWT_SECRET:heavyMachinerySecretKeyForJwtTokenSigning2026!@#StrongSecureKeyLongEnough}
  expiration: 86400000 # 24小时

# 日志
logging:
  level:
    com.heavymachinery: info
    org.hibernate.SQL: warn

# 生产环境配置（通过 application-prod.yml 或环境变量覆盖）
# spring.config.activate.on-profile: prod
